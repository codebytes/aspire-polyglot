services:
  docker:
    image: docker:29-dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    command:
      - dockerd
      - --host=unix:///validation/docker.sock
      - --bip=10.254.0.1/24
      - --default-address-pool=base=10.253.0.0/16,size=24
    volumes:
      - runtime:/validation
      - docker-data:/var/lib/docker
    healthcheck:
      test: ["CMD", "docker", "--host", "unix:///validation/docker.sock", "info"]
      interval: 1s
      timeout: 5s
      retries: 120
      start_period: 2s

  runner:
    image: aspire-polyglot-linux-previews:13.6.1
    init: true
    network_mode: service:docker
    environment:
      DOCKER_HOST: unix:///validation/docker.sock
      TMPDIR: /validation
    volumes:
      - runtime:/validation
    depends_on:
      docker:
        condition: service_healthy

volumes:
  runtime:
  docker-data:
